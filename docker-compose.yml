services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: tewsday-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tewsday
    ports:
      - '5432:5432'
    volumes:
      - tewsday_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tewsday-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - tewsday_redisdata:/data

volumes:
  tewsday_pgdata:
  tewsday_redisdata:
